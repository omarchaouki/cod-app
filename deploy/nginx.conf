# /etc/nginx/sites-available/cahier-eps
#
# Reverse proxy in front of the Next.js standalone server.
# Replace your-domain.com with your real domain before installing.

# Rate limit the order endpoint at the edge as well as in the app. The
# in-process limiter in the app is per-instance; this one runs before Node is
# ever woken up, which is what protects you from a flood.
limit_req_zone $binary_remote_addr zone=orders:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Certbot rewrites this block to redirect to HTTPS. Leave it for now.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # Certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A landing page carrying ad traffic should never be framed by someone else.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The HTML is ~120 KB before compression, mostly Arabic text, which gzips
    # extremely well. This is the single biggest win for mobile visitors.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/rss+xml application/atom+xml image/svg+xml
        application/manifest+json;

    client_max_body_size 2m;

    # Hashed build assets — safe to cache forever, served by nginx directly so
    # Node never sees the request.
    location /_next/static/ {
        alias /var/www/cahier-eps/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Product photos in /public/images.
    location /images/ {
        alias /var/www/cahier-eps/current/public/images/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimised images come from Next's image optimiser, so they must be
    # proxied — but the responses are cacheable for a long time.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 365d;
    }

    # Order submissions: throttle bursts before they reach the app.
    location /api/orders {
        limit_req zone=orders burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app hashes this to rate-limit and to store a salted IP. Without
        # it every visitor looks like 127.0.0.1 and the limiter blocks the
        # whole site after eight orders.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
